<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#23201c; --muted:#6f6a62;
    --line:#e2ded6; --accent:#2f6f5e; --accent-soft:#e6f0ec;
    --wrong:#c0392b; --wrong-soft:#fbeceb; --right:#2f7d4f;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1b1a18; --card:#242220; --ink:#ece8e1; --muted:#a29b91;
      --line:#38352f; --accent:#7fc3ae; --accent-soft:#25332e;
      --wrong:#ef8377; --wrong-soft:#3a2622; --right:#7fc38c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1a18; --card:#242220; --ink:#ece8e1; --muted:#a29b91;
    --line:#38352f; --accent:#7fc3ae; --accent-soft:#25332e;
    --wrong:#ef8377; --wrong-soft:#3a2622; --right:#7fc38c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:820px; margin:0 auto; padding:20px 16px 80px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px}
  h1{font-size:1.45rem; margin:0 0 6px}
  h2{font-size:1.05rem; margin:22px 0 10px; color:var(--accent)}
  .muted{color:var(--muted); font-size:.9rem}
  button{
    font:inherit; background:var(--accent); color:#fff; border:0; border-radius:10px;
    padding:11px 18px; cursor:pointer; -webkit-appearance:none;
  }
  button.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent)}
  button:disabled{opacity:.5; cursor:default}
  input[type=text],input[type=password],textarea{
    font:inherit; width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:9px; background:var(--bg); color:var(--ink);
  }
  textarea{min-height:110px; resize:vertical}

  /* 導覽列：每一頁都有「主選單」 */
  .nav{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
  .nav button{padding:8px 14px; font-size:.92rem}
  .nav .sp{flex:1}

  /* 主選單：科目卡片 */
  .subj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
  .subj-card{
    display:block; width:100%; text-align:center; padding:20px 10px;
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:14px;
  }
  .subj-card:hover{border-color:var(--accent); background:var(--accent-soft)}
  .subj-card .ico{display:block; font-size:2.1rem; line-height:1.3}
  .subj-card .nm{display:block; font-weight:700; font-size:1.08rem; margin-top:2px}
  .subj-card .num{display:block; color:var(--muted); font-size:.85rem}

  /* 科目內：考卷清單 */
  .exam-list button{display:block; width:100%; text-align:left; background:var(--card);
    color:var(--ink); border:1px solid var(--line); margin-bottom:8px; padding:13px 15px}
  .exam-list button:hover{border-color:var(--accent)}

  .q{border-top:1px solid var(--line); padding:14px 0}
  .q:first-of-type{border-top:0}
  .q-head{display:flex; gap:8px; align-items:baseline}
  .q-no{font-weight:700; color:var(--accent); min-width:2.4em}
  .opts{margin:8px 0 0 2.4em; display:grid; gap:6px}
  .opt{display:flex; gap:9px; align-items:flex-start; padding:7px 10px; border-radius:9px; cursor:pointer}
  .opt:hover{background:var(--accent-soft)}
  .opt input{margin-top:6px}
  .fill-in{margin:8px 0 0 2.4em; max-width:320px}
  .open-in{margin:8px 0 0 2.4em}
  .bar{position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line);
    padding:10px 16px; display:flex; gap:10px; align-items:center; justify-content:space-between;
    margin:0 -16px -80px; }
  .bar .home{padding:8px 12px; font-size:.92rem}
  .bar .muted{flex:1; text-align:center}
  .score{font-size:2.4rem; font-weight:700; color:var(--accent); line-height:1.2}
  .mark{font-weight:700; margin-left:6px}
  .mark.ok{color:var(--right)}
  .mark.no{color:var(--wrong)}
  .r-wrong{background:var(--wrong-soft); border-radius:10px; padding:10px 12px; margin-left:2.4em}
  .r-line{margin-left:2.4em; font-size:.95rem}
  .r-line b{color:var(--right)}
  .self{display:flex; gap:8px; margin:10px 0 0 2.4em; flex-wrap:wrap}
  .self button{padding:7px 14px; font-size:.9rem}
  .self button.sel{outline:3px solid var(--accent-soft)}
  .err{color:var(--wrong); margin-top:10px}
  .hide{display:none}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">

  <!-- 登入 -->
  <div id="gate" class="card hide">
    <h1>模擬試題</h1>
    <p class="muted">點你的名字進入。</p>
    <div class="subj-grid" id="pickGrid"><span class="muted">載入中…</span></div>
    <p><a href="#" id="showCode" class="muted">用代碼進入（家教同學）</a></p>
    <div id="codeBox" class="hide">
      <input type="text" id="code" autocomplete="off" autocapitalize="none" placeholder="作答代碼">
      <p><button id="go">進入</button></p>
    </div>
    <div id="gateErr" class="err"></div>
  </div>

  <!-- 主選單：先選科目 -->
  <div id="menu" class="hide">
    <div class="card">
      <h1>模擬試題</h1>
      <p class="muted" id="who"></p>
      <div class="subj-grid" id="subjects"></div>
    </div>
    <p class="muted" style="text-align:center">
      <button class="ghost" data-act="logout" style="padding:6px 12px;font-size:.85rem">換人／換代碼</button>
    </p>
  </div>

  <!-- 科目內：再選考卷 -->
  <div id="subj" class="hide">
    <div class="nav">
      <button class="ghost" data-act="home">🏠 主選單</button>
    </div>
    <div class="card">
      <h1 id="subjTitle"></h1>
      <p class="muted" id="subjMeta"></p>
      <div class="exam-list" id="exams"></div>
    </div>
  </div>

  <!-- 作答 -->
  <div id="exam" class="hide">
    <div class="nav">
      <button class="ghost" data-act="home">🏠 主選單</button>
      <button class="ghost" data-act="subject" id="exSubjBtn"></button>
      <span class="sp"></span>
      <span class="muted">進度會自動存在這台裝置</span>
    </div>
    <div class="card">
      <h1 id="exTitle"></h1>
      <p class="muted" id="exMeta"></p>
    </div>
    <div class="card" id="exBody"></div>
    <div class="bar">
      <button class="ghost home" data-act="home" title="回主選單">🏠</button>
      <span class="muted" id="progress"></span>
      <button id="submit">交卷</button>
    </div>
  </div>

  <!-- 結果 -->
  <div id="result" class="hide">
    <div class="nav">
      <button class="ghost" data-act="home">🏠 主選單</button>
      <button class="ghost" data-act="subject" id="resSubjBtn"></button>
    </div>
    <div class="card">
      <div class="score" id="scoreLine"></div>
      <p class="muted" id="scoreMeta"></p>
      <div id="openNote" class="muted hide">非選擇題請自己對照參考答案打分數，按下面的按鈕就會記錄起來。</div>
      <div class="btn-row" style="margin-top:10px">
        <button id="retryWrong" class="hide">只重做錯的題目</button>
        <button class="ghost" data-act="subject" id="resSubjBtn2"></button>
        <button class="ghost" data-act="home">🏠 回主選單</button>
      </div>
    </div>
    <div class="card" id="resBody"></div>
  </div>

</div>

<script>
  var EXAM_ID = '<?= examId ?>';
  var PRESET  = '<?= presetCode ?>';

  var SUBJECT_ORDER = ['國文','英文','數學','理化','地理','歷史','公民','社會'];
  var SUBJECT_ICON  = {'國文':'📖','英文':'🔤','數學':'📐','理化':'🔬','地理':'🌏','歷史':'📜','公民':'⚖️','社會':'🧭'};

  var state = {
    code:'', student:null, exams:null, subject:'',
    exam:null, answers:{}, result:null, openScores:{}, round:'首次', only:null, view:'gate'
  };

  function $(id){ return document.getElementById(id); }
  function show(id){
    state.view = id;
    ['gate','menu','subj','exam','result'].forEach(function(v){ $(v).classList.toggle('hide', v!==id); });
    window.scrollTo(0,0);
    if (id==='gate') loadPicks();
  }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function typeset(){ if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(); }

  /* 作答草稿：以「考卷＋學生＋首次/重做」為單位，重做錯題的草稿不會混進完整考卷 */
  function storeKey(){
    return 'mockexam:'+(state.exam?state.exam.id:'')+':'+(state.student?state.student.name:'')+':'+state.round;
  }
  function saveLocal(){ try{ localStorage.setItem(storeKey(), JSON.stringify(state.answers)); }catch(e){} }
  function loadLocal(){ try{ var v=localStorage.getItem(storeKey()); return v?JSON.parse(v):{}; }catch(e){ return {}; } }
  function clearLocal(){ try{ localStorage.removeItem(storeKey()); }catch(e){} }

  /* ---------- 登入 ---------- */
  var picksLoaded = false;
  function loadPicks(){
    if (picksLoaded) return;
    google.script.run
      .withSuccessHandler(function(res){
        picksLoaded = true;
        var tiles = (res.students||[]).map(function(s){
          return '<button class="subj-card" data-pick="'+esc(s.name)+'">'+
            '<span class="ico">'+(s.name.slice(0,1))+'</span>'+
            '<span class="nm">'+esc(s.name)+'</span>'+
            (s.grade?'<span class="num">'+esc(s.grade)+' 年級</span>':'')+'</button>';
        });
        if (res.guest) tiles.push('<button class="subj-card" data-pick="guest">'+
          '<span class="ico">👤</span><span class="nm">訪客</span><span class="num">不記名</span></button>');
        if (tiles.length) $('pickGrid').innerHTML = tiles.join('');
        else { $('pickGrid').innerHTML=''; $('codeBox').classList.remove('hide'); $('showCode').classList.add('hide'); }
      })
      .withFailureHandler(function(){
        $('pickGrid').innerHTML='';
        $('codeBox').classList.remove('hide'); $('showCode').classList.add('hide');
      })
      .apiPickList();
  }

  function login(code){
    $('gateErr').textContent='';
    $('go').disabled = true;
    google.script.run
      .withSuccessHandler(function(res){
        $('go').disabled = false;
        state.code = code;
        state.student = res.student;
        state.exams = res.exams;
        try{ localStorage.setItem('mockexam:code', code); }catch(e){}
        if (EXAM_ID) { var id = EXAM_ID; EXAM_ID = ''; openExam(id); }
        else { renderMenu(); }
      })
      .withFailureHandler(function(err){
        $('go').disabled = false;
        show('gate');
        $('gateErr').textContent = err.message || '進不去，請再確認代碼。';
      })
      .apiLogin(code);
  }

  function logout(){
    try{ localStorage.removeItem('mockexam:code'); }catch(e){}
    state.code=''; state.student=null; state.exams=null; state.subject='';
    EXAM_ID=''; PRESET='';
    $('code').value=''; $('gateErr').textContent='';
    show('gate');
  }

  /* 背景重抓考卷清單（新卷子出來時，不用重開網頁就看得到） */
  function refreshExams(){
    if (!state.code) return;
    google.script.run
      .withSuccessHandler(function(res){
        state.exams = res.exams;
        if (state.view === 'menu') renderMenu(true);
        else if (state.view === 'subj') renderSubject(true);
      })
      .withFailureHandler(function(){})
      .apiLogin(state.code);
  }

  /* ---------- 導覽 ---------- */
  function goMenu(){
    EXAM_ID = '';
    if (!state.code) { show('gate'); return; }
    if (state.exams) { renderMenu(); refreshExams(); }
    else {
      show('menu'); $('who').textContent = '載入中…'; $('subjects').innerHTML = '';
      refreshExams();
    }
  }

  function goSubject(name){
    state.subject = name || state.subject;
    if (!state.exams) { goMenu(); return; }
    renderSubject(); refreshExams();
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'home') goMenu();
    else if (a === 'subject' || a === 'pick') goSubject(t.getAttribute('data-subj'));
    else if (a === 'logout') logout();
  });

  /* ---------- 主選單：科目 ---------- */
  function groupBySubject(exams){
    var map = {};
    (exams||[]).forEach(function(x){
      var s = x.subject || '其他';
      (map[s] = map[s] || []).push(x);
    });
    var names = Object.keys(map).sort(function(a,b){
      var ia = SUBJECT_ORDER.indexOf(a), ib = SUBJECT_ORDER.indexOf(b);
      if (ia < 0) ia = 99; if (ib < 0) ib = 99;
      return ia === ib ? a.localeCompare(b) : ia - ib;
    });
    return { map: map, names: names };
  }

  function renderMenu(keepScroll){
    var g = groupBySubject(state.exams);
    $('who').textContent = (state.student ? state.student.name : '') + '，先選一個科目。';
    var html = g.names.map(function(n){
      return '<button class="subj-card" data-act="pick" data-subj="'+esc(n)+'">'+
             '<span class="ico">'+(SUBJECT_ICON[n]||'📚')+'</span>'+
             '<span class="nm">'+esc(n)+'</span>'+
             '<span class="num">'+g.map[n].length+' 份考卷</span></button>';
    }).join('');
    $('subjects').innerHTML = html || '<p class="muted">目前沒有指派給你的考卷。</p>';
    var y = window.scrollY;
    show('menu');
    if (keepScroll) window.scrollTo(0, y);
  }

  /* ---------- 科目內：考卷清單 ---------- */
  function renderSubject(keepScroll){
    var g = groupBySubject(state.exams);
    var list = (g.map[state.subject] || []).slice().sort(function(a,b){
      var da = String(a.date||''), db = String(b.date||'');
      if (da !== db) return db.localeCompare(da);
      return String(b.id).localeCompare(String(a.id));
    });
    $('subjTitle').textContent = (SUBJECT_ICON[state.subject]||'📚') + ' ' + state.subject;
    $('subjMeta').textContent = list.length ? '共 '+list.length+' 份，新的在最上面。選一份開始。' : '';
    var html = list.map(function(e){
      return '<button data-id="'+esc(e.id)+'"><strong>'+esc(e.title)+'</strong><br>'+
             '<span class="muted">'+esc([e.grade,e.chapter].filter(Boolean).join('　'))+
             (e.date? '　'+esc(e.date):'')+'</span></button>';
    }).join('');
    $('exams').innerHTML = html || '<p class="muted">這個科目目前沒有考卷。</p>';
    Array.prototype.forEach.call($('exams').querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){ openExam(b.getAttribute('data-id')); });
    });
    var y = window.scrollY;
    show('subj');
    if (keepScroll) window.scrollTo(0, y);
  }

  /* ---------- 作答 ---------- */
  function openExam(id){
    google.script.run
      .withSuccessHandler(function(res){
        state.exam = res.exam;
        state.student = res.student;
        state.round = '首次';
        state.only = null;
        state.subject = res.exam.subject || state.subject;
        state.answers = loadLocal();
        renderExam();
      })
      .withFailureHandler(function(err){
        alert(err.message || '打不開這份考卷');
        if (state.exams) goMenu(); else show('gate');
      })
      .apiGetExam(state.code, id);
  }

  function setSubjectButtons(){
    var label = '‹ ' + (state.subject || '科目');
    ['exSubjBtn','resSubjBtn','resSubjBtn2'].forEach(function(id){
      var b = $(id); if (!b) return;
      b.textContent = label;
      b.setAttribute('data-subj', state.subject || '');
    });
  }

  function renderExam(){
    var ex = state.exam;
    setSubjectButtons();
    $('exTitle').textContent = ex.title || ex.chapter || '模擬試題';
    $('exMeta').textContent = [ex.grade, ex.subject, ex.chapter].filter(Boolean).join('　') +
      '　滿分 ' + ex.full + ' 分' + (ex.note ? '　'+ex.note : '');

    var html = '';
    ex.sections.forEach(function(sec, si){
      var only = state.only;
      var qs = sec.questions.filter(function(q){ return !only || only.indexOf(q.key)>=0; });
      if (!qs.length) return;
      html += '<h2>'+esc(sec.name)+'<span class="muted">（每題 '+sec.points+' 分）</span></h2>';
      sec.questions.forEach(function(q, qi){
        if (only && only.indexOf(q.key)<0) return;
        html += '<div class="q" data-key="'+q.key+'">'+
                '<div class="q-head"><span class="q-no">'+(qi+1)+'.</span><span>'+q.q+'</span></div>';
        if (sec.type === 'mc'){
          html += '<div class="opts">' + (q.options||[]).map(function(o,oi){
            var checked = String(state.answers[q.key]) === String(oi) ? ' checked' : '';
            return '<label class="opt"><input type="radio" name="'+q.key+'" value="'+oi+'"'+checked+'>'+
                   '<span><b>('+'ABCD'.charAt(oi)+')</b> '+o+'</span></label>';
          }).join('') + '</div>';
        } else if (sec.type === 'fill'){
          html += '<div class="fill-in"><input type="text" data-k="'+q.key+'" autocomplete="off" value="'+
                  esc(state.answers[q.key]||'')+'" placeholder="答案"></div>';
        } else {
          html += '<div class="open-in"><textarea data-k="'+q.key+'" placeholder="寫出過程">'+
                  esc(state.answers[q.key]||'')+'</textarea></div>';
        }
        html += '</div>';
      });
    });
    $('exBody').innerHTML = html;

    Array.prototype.forEach.call($('exBody').querySelectorAll('input[type=radio]'), function(el){
      el.addEventListener('change', function(){ state.answers[el.name]=el.value; saveLocal(); updateProgress(); });
    });
    Array.prototype.forEach.call($('exBody').querySelectorAll('[data-k]'), function(el){
      el.addEventListener('input', function(){ state.answers[el.getAttribute('data-k')]=el.value; saveLocal(); updateProgress(); });
    });

    updateProgress();
    show('exam');
    typeset();
  }

  function allKeys(){
    var keys=[];
    state.exam.sections.forEach(function(sec){
      sec.questions.forEach(function(q){ if(!state.only || state.only.indexOf(q.key)>=0) keys.push(q.key); });
    });
    return keys;
  }

  function updateProgress(){
    var keys = allKeys();
    var done = keys.filter(function(k){ var v=state.answers[k]; return v!==undefined && String(v).trim()!==''; }).length;
    $('progress').textContent = '已作答 ' + done + ' / ' + keys.length;
  }

  $('submit').addEventListener('click', function(){
    var keys = allKeys();
    var blank = keys.filter(function(k){ var v=state.answers[k]; return v===undefined || String(v).trim()===''; }).length;
    if (blank && !confirm('還有 '+blank+' 題沒寫，確定要交卷嗎？')) return;
    $('submit').disabled = true;
    $('submit').textContent = '改分中…';
    var payload = {};
    keys.forEach(function(k){ if(state.answers[k]!==undefined) payload[k]=state.answers[k]; });
    google.script.run
      .withSuccessHandler(function(res){
        $('submit').disabled=false; $('submit').textContent='交卷';
        state.result = res; state.openScores = {};
        clearLocal();
        renderResult();
      })
      .withFailureHandler(function(err){
        $('submit').disabled=false; $('submit').textContent='交卷';
        alert(err.message || '交卷失敗，請再試一次');
      })
      .apiSubmit(state.code, state.exam.id, payload, state.round);
  });

  /* ---------- 結果 ---------- */
  function renderResult(){
    var r = state.result;
    setSubjectButtons();
    var graded = r.items.filter(function(i){ return i.correct !== null; });
    var okCount = graded.filter(function(i){ return i.correct; }).length;
    var opens = r.items.filter(function(i){ return i.correct === null; });

    $('scoreLine').textContent = r.objectiveScore + ' 分';
    $('scoreMeta').textContent = '客觀題答對 ' + okCount + ' / ' + graded.length +
      '　滿分 ' + r.full + ' 分' + (opens.length ? '（非選 ' + opens.length + ' 題待自評）' : '');
    $('openNote').classList.toggle('hide', opens.length === 0);

    var html = r.items.map(function(it){
      var qHtml = questionText(it.key);
      var s = '<div class="q"><div class="q-head"><span class="q-no">'+esc(it.label)+'</span><span>'+qHtml+'</span></div>';
      if (it.correct === true){
        s += '<div class="r-line"><span class="mark ok">✓ 答對</span></div>';
      } else if (it.correct === false){
        var yours;
        if (it.type === 'mc'){
          yours = (it.given === '' || it.given === null || it.given === undefined)
            ? '沒作答'
            : '(' + 'ABCD'.charAt(Number(it.given)) + ') ' + (it.givenText || '');
        } else {
          yours = it.given ? esc(it.given) : '沒作答';
        }
        s += '<div class="r-wrong"><span class="mark no">✗ 答錯</span><br>'+
             '你的答案：'+yours+'<br>'+
             '正確答案：<b>'+(it.type==='mc' ? '('+'ABCD'.charAt(it.answerIndex)+') ' : '')+(it.answerText||'')+'</b>'+
             (it.explain ? '<br><span class="muted">'+it.explain+'</span>' : '')+'</div>';
      } else {
        s += '<div class="r-line"><span class="muted">你寫的：</span><br>'+ (esc(it.given)||'<span class="muted">（空白）</span>').replace(/\n/g,'<br>') +'</div>';
        s += '<div class="r-line" style="margin-top:8px"><span class="muted">參考答案：</span><br>'+(it.answerText||'')+
             (it.explain ? '<br><span class="muted">'+it.explain+'</span>' : '')+'</div>';
        s += '<div class="self" data-key="'+it.key+'">'+
             [['滿分',it.points],['一半',Math.round(it.points/2)],['沒對',0]].map(function(p){
               return '<button class="ghost" data-score="'+p[1]+'">'+p[0]+'（'+p[1]+' 分）</button>';
             }).join('')+'</div>';
      }
      return s + '</div>';
    }).join('');
    $('resBody').innerHTML = html;

    Array.prototype.forEach.call($('resBody').querySelectorAll('.self'), function(box){
      var key = box.getAttribute('data-key');
      Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){
        b.addEventListener('click', function(){
          Array.prototype.forEach.call(box.querySelectorAll('button'), function(x){ x.classList.remove('sel'); });
          b.classList.add('sel');
          state.openScores[key] = Number(b.getAttribute('data-score'));
          sendOpenScores();
        });
      });
    });

    var wrongKeys = r.items.filter(function(i){ return i.correct === false; }).map(function(i){ return i.key; });
    $('retryWrong').classList.toggle('hide', wrongKeys.length === 0);
    $('retryWrong').onclick = function(){
      state.only = wrongKeys;
      state.round = '重做';
      state.answers = {};
      renderExam();
    };

    show('result');
    typeset();
  }

  function questionText(key){
    var out = '';
    state.exam.sections.forEach(function(sec){
      sec.questions.forEach(function(q){ if (q.key === key) out = q.q; });
    });
    return out;
  }

  function sendOpenScores(){
    if (!state.result) return;
    google.script.run
      .withSuccessHandler(function(res){
        $('scoreLine').textContent = res.total + ' 分';
      })
      .withFailureHandler(function(){})
      .apiRecordOpen(state.code, state.result.attemptId, state.openScores);
  }

  /* ---------- 起動 ---------- */
  $('pickGrid').addEventListener('click', function(e){
    var b = e.target.closest('[data-pick]');
    if (b) login('pick:' + b.getAttribute('data-pick'));
  });
  $('showCode').addEventListener('click', function(e){
    e.preventDefault(); $('codeBox').classList.remove('hide'); $('showCode').classList.add('hide'); $('code').focus();
  });
  $('go').addEventListener('click', function(){ login($('code').value.trim()); });
  $('code').addEventListener('keydown', function(e){ if(e.key==='Enter') login($('code').value.trim()); });

  (function init(){
    var saved = '';
    try{ saved = localStorage.getItem('mockexam:code') || ''; }catch(e){}
    var code = PRESET || saved;
    if (code){ if (code.indexOf('pick:')!==0) $('code').value = code; show('gate'); login(code); }
    else { show('gate'); }
  })();
</script>
