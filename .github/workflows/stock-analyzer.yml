name: Taiwan Stock Smart Pool Analyzer

on:
  schedule:
      # 每个台股营业日早上 06:30 (台北时区)
      # 0 22 * * 1-5 = 每个工作日 22:00 UTC (06:30 台北时区)
      - cron: '30 22 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  analyze-stocks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock analysis
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python smart_pool_analyzer.py

      - name: Check for output files
        run: ls -la *.csv 2>/dev/null || echo "No CSV files generated"
